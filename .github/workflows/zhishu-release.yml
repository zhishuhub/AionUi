name: Zhishu desktop release

# 智枢 AI 工作台的打包：推 v{上游版本}-zs.{序号} 的 tag 触发，打 Windows（x64）、macOS（Apple 芯片、Intel）
# 安装程序，直接发正式 Release。不签名、不公证、不上传 Sentry；上游的构建与分发工作流依赖它们自己的密钥，不用。
on:
  push:
    tags:
      - 'v*-zs.*'

permissions:
  contents: write

concurrency:
  group: zhishu-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            arch: x64
            command: node scripts/build-with-builder.js x64 --win --x64
          - name: macos-arm64
            runner: macos-15
            arch: arm64
            command: node scripts/build-with-builder.js arm64 --mac --arm64
          - name: macos-x64
            runner: macos-15-intel
            arch: x64
            command: node scripts/build-with-builder.js x64 --mac --x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check tag matches app version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun install --global node-gyp
          "WindowsTargetPlatformVersion=10.0.19041.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron (macOS)
        if: runner.os == 'macOS'
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers

      - name: Rebuild native modules for Electron (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          electron_ver=$(node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')")
          sqlite_node=node_modules/better-sqlite3/build/Release/better_sqlite3.node
          # 没有对应 Electron 版本的预编译包时 prebuild-install 非零退出，改为本地编译
          bun x --yes prebuild-install --runtime=electron --target="$electron_ver" --platform=win32 --arch=x64 --force ||
            echo "no prebuilt better-sqlite3 for Electron $electron_ver, building from source"
          if [ ! -f "$sqlite_node" ]; then
            bunx electron-rebuild -f -w better-sqlite3 || echo "electron-rebuild exited with $?"
          fi
          if [ ! -f "$sqlite_node" ]; then
            echo "better-sqlite3 native module was not built" >&2
            exit 1
          fi
          ls -la "$sqlite_node"
        env:
          npm_config_runtime: electron
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Prepare aioncore binary
        shell: bash
        run: node scripts/prepareAioncore.js
        env:
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build installer
        shell: bash
        run: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          CI: true
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      # 发版前在构建机上静默装一遍：安装器报错（退出码非 0）或装完找不到程序文件，这次构建就失败，不发 Release
      - name: Verify Windows installer installs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $productName = (Select-String -Path packages/desktop/electron-builder.yml -Pattern '^productName:\s*(\S+)').Matches[0].Groups[1].Value
          $installer = Get-ChildItem -Path out -Filter "$productName-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "installer $productName-*-win-x64.exe not found in out/" }
          $installDir = Join-Path $env:RUNNER_TEMP 'zhishu-install-check'
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          Write-Host "installer exit code: $($proc.ExitCode)"
          $candidates = @(
            $installDir,
            (Join-Path $env:LOCALAPPDATA "Programs\$productName"),
            (Join-Path $env:ProgramFiles $productName)
          )
          $exePath = $candidates | ForEach-Object { Join-Path $_ "$productName.exe" } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($proc.ExitCode -ne 0 -or -not $exePath) {
            Get-ChildItem -Path $env:TEMP -Filter 'aionui-installer-*.jsonl' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "== $($_.FullName)"
              Get-Content -LiteralPath $_.FullName
            }
            throw "installer failed: exit code $($proc.ExitCode), $productName.exe found at: $exePath"
          }
          Write-Host "installed: $exePath"

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: |
            out/ZhishuWorkbench-*-win-x64.exe
            out/ZhishuWorkbench-*-mac-*.dmg
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-release -type f \( -name '*.exe' -o -name '*.dmg' \) | sort)
          test "${#files[@]}" -eq 3
          ( cd dist-release && find . -type f \( -name '*.exe' -o -name '*.dmg' \) -exec sha256sum {} + )
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "智枢 AI 工作台：对话、操作文件、定时提醒和生图，在智枢网站点「一键接入」即可使用。改动见 MODIFICATIONS.md。基于 https://github.com/iOfficeAI/AionUi 修改，遵循 Apache-2.0。"
