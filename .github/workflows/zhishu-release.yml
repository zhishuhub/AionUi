name: Zhishu desktop release

# 智枢 AI 工作台的打包：推 v{上游版本}-zs.{序号} 的 tag 触发，打 Windows（x64）、macOS（Apple 芯片、Intel）
# 安装程序，直接发正式 Release。不签名、不公证、不上传 Sentry；上游的构建与分发工作流依赖它们自己的密钥，不用。
on:
  push:
    tags:
      - 'v*-zs.*'

permissions:
  contents: write

concurrency:
  group: zhishu-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            arch: x64
            command: node scripts/build-with-builder.js x64 --win --x64
          - name: macos-arm64
            runner: macos-15
            arch: arm64
            command: node scripts/build-with-builder.js arm64 --mac --arm64
          - name: macos-x64
            runner: macos-15-intel
            arch: x64
            command: node scripts/build-with-builder.js x64 --mac --x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check tag matches app version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun install --global node-gyp
          "WindowsTargetPlatformVersion=10.0.19041.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron (macOS)
        if: runner.os == 'macOS'
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers

      - name: Rebuild native modules for Electron (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()
          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          # 没有对应 Electron 版本的预编译包时 prebuild-install 会非零退出，接住后改为本地编译（同上游做法）
          try {
            bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=x64 --force 2>&1
          } catch {
            Write-Host "prebuild-install failed: $_"
          }
          if (-not (Test-Path $sqliteNode)) {
            try {
              bunx electron-rebuild -f -w better-sqlite3
            } catch {
              Write-Host "electron-rebuild failed: $_"
            }
          }
          if (-not (Test-Path $sqliteNode)) {
            Write-Error "better-sqlite3 native module was not built"
            exit 1
          }
        env:
          npm_config_runtime: electron
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Prepare aioncore binary
        shell: bash
        run: node scripts/prepareAioncore.js
        env:
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build installer
        shell: bash
        run: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          CI: true
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: |
            out/ZhishuWorkbench-*-win-x64.exe
            out/ZhishuWorkbench-*-mac-*.dmg
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-release -type f \( -name '*.exe' -o -name '*.dmg' \) | sort)
          test "${#files[@]}" -eq 3
          ( cd dist-release && find . -type f \( -name '*.exe' -o -name '*.dmg' \) -exec sha256sum {} + )
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "智枢 AI 工作台：对话、操作文件、定时提醒和生图，在智枢网站点「一键接入」即可使用。改动见 MODIFICATIONS.md。基于 https://github.com/iOfficeAI/AionUi 修改，遵循 Apache-2.0。"
